---
"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://dm-screen.local/schema/data.schema.yaml"

title: DMScreen Data Schema
description: Holds data recorded by DnD Dungeon Masters.
type: object

"$defs":
  PlayerId: { type: string, minLength: 1, description: "Unique player character identifier" }
  NpcId: { type: string, minLength: 1, description: "Unique non-player character identifier" }
  CreatureId: { type: string, minLength: 1, description: "Unique creature identifier" } 

  Campaigns:
    type: array
    description: Campaigns
    items:
      "$ref": "#/$defs/Campaign"
    uniqueItems: true

  Campaign:
    type: object
    title: Campaign
    description: The root data structure containing all campaign information
    properties:
      id: { type: string, description: "Unique campaign identifier" }
      name: { type: string, description: "Campaign name", default: "New Campaign", minLength: 1 }
      description: { type: string, description: "Campaign description (optional)" }
      party:
        type: array
        description: Set of player characters
        items:
          "$ref": "#/$defs/PlayerCharacter"
        uniqueItems: true
      encounters:
        type: array
        description: List of encounters in the campaign
        items:
          "$ref": "#/$defs/Encounter"
    required: 
    - id
    - name
    - party
    # - encounters
    additionalProperties: false

  Encounter:
    type: object
    title: Encounter
    description: An encounter within a campaign
    properties:
      id: { type: string, description: "Unique encounter identifier" }
      title: { type: string, description: "Encounter title", minLength: 1 }
      summary: { type: string, description: "Brief summary of the encounter (optional)" }
      location: { type: string, description: "Location of the encounter (optional)" }
      status: { "$ref": "#/$defs/EncounterStatus" }
      difficulty: { type: string, description: "Encounter difficulty (optional)" }
      participants:
        type: array
        description: List of people and creatures present in the encounter, whether or not they participate in combat
        items:
          "$ref": "#/$defs/Participant"
        uniqueItems: true
    required:
    - id
    - title
    - status
    additionalProperties: false

  EncounterStatus:
    type: string
    description: "Status of an encounter"
    enum: ["Draft", "Ready", "Ongoing", "Completed"]

  PlayerCharacter:
    type: object
    title: Player Character
    description: A player character (PC) in the campaign
    properties:
      id: { "$ref": "#/$defs/PlayerId" }
      name: { type: string, description: "Character name", minLength: 1 }
      portrait: { type: string, description: "Character portrait image data URL (optional)" }
      race: { type: string, description: "Character race (recommended)" }
      classes:
        type: array
        description: Character classes (recommended)
        items: { type: string }
      hitPoints:
        type: integer
        description: Current hit points
      maxHitPoints:
        type: integer
        minimum: 1
        maximum: 300
        default: 10
        description: Maximum hit points
      conditions:
        type: array
        description: List of active conditions (can be empty)
        items:
          type: string
    required:
    - id
    - name
    - maxHitPoints
    additionalProperties: true

  NonPlayerCharacter:
    type: object
    title: Non-Player Character
    description: An NPC in the campaign
    properties:
      id: { "$ref": "#/$defs/NpcId" }
      name:
        type: string
        description: NPC name
    required:
    - id
    - name
    additionalProperties: true

  Participant:
    type: object
    title: Participant
    description: 'A person or creature present in an encounter (PC, NPC, or creature), whether or not they participate in combat. Lifecycle: current encounter'
    properties:
      type: { "$ref": "#/$defs/ParticipantType" }
      id: 
        oneOf: [ { "$ref": "#/$defs/PlayerId" }, { "$ref": "#/$defs/NpcId" }, { "$ref": "#/$defs/CreatureId" } ]
        description: 'Unique identifier for the participant (must match a PC, NPC, or creature)'
      imageId:
        oneOf: [ { "$ref": "#/$defs/PlayerId" }, { "$ref": "#/$defs/NpcId" }, { "$ref": "#/$defs/CreatureId" } ]
        description: 'Identifier for the participant image (optional)'
      name:
        type: string
        description: Participant name
        minLength: 1
      initiativeRoll:
        type: integer
        description: Initiative roll result, if this participant takes part in combat
      hitPoints:
        type: integer
        minimum: 0
        description: Current hit points, if tracked (initialized from source, persisted for PCs only)
      temporaryHitPoints:
        type: integer
        minimum: 0
        description: Temporary hit points (optional)
      conditions:
        type: array
        description: List of active conditions
        items:
          type: string
    required:
    - type
    - id
    - name
    - initiativeRoll
    - hitPoints
    - conditions
    additionalProperties: false

  ParticipantType:
    type: string
    enum:
    - pc
    - npc
    - creature
    description: Participant type to guide UI behavior

  ParticipantRef:
    type: object
    properties:
      type: { "$ref": "#/$defs/ParticipantType" }
      id:
        oneOf: [ { "$ref": "#/$defs/PlayerId" }, { "$ref": "#/$defs/NpcId" }, { "$ref": "#/$defs/CreatureId" } ]
        description: 'Unique identifier PC, NPC or Creature'
    description: Unique identifier for a participant (must match a participant id in Encounter.participants)

  ActionType:
    type: string
    enum:
    - attack
    - cast_spell
    - interact
    - dash
    - disengage
    - dodge
    - help
    - hide
    - ready
    - search
    - use_object
    description: Type of action taken
    
  Round:
    type: object
    title: Combat Round
    description: A round of combat containing all turns
    properties:
      number: { type: integer, minimum: 1, description: "Round number (must be in sync with array index in Encounter.rounds)" }
      turns:
        type: array
        description: List of turns in this round
        items:
          "$ref": "#/$defs/Turn"
    required:
    - number
    - turns
    additionalProperties: false

  Turn:
    type: object
    title: Combat Turn
    description: A single participant's turn in a round
    properties:
      participantId:
        "$ref": "#/$defs/ParticipantRef"
        description: ID of the participant taking this turn (must match a participant
          id in Encounter.participants)
      events:
        type: array
        description: Events that occurred during this turn (can be empty)
        items:
          "$ref": "#/$defs/Event"
    required:
    - participantId
    - events
    additionalProperties: false

  Success:
    type: string
    enum:
    - critical_miss
    - miss
    - hit
    - critical_hit
    description: Degree of success of an attack or spell effect

  DamageType:
    type: string
    enum:
    - bludgeoning
    - piercing
    - slashing
    - fire
    - cold
    - lightning
    - acid
    - poison
    - psychic
    - necrotic
    - radiant
    - thunder
    description: Type of damage dealt

  EventType:
    type: string
    enum:
    - action
    - effect
    - movement
    - other
    description: Classification of an event

  Event:
    type: object
    title: Combat Event
    description: An event that occurred during a turn
    properties:
      type: { "$ref": "#/$defs/EventType" }
      data:
        oneOf:
        - "$ref": "#/$defs/ActionEvent"
        - "$ref": "#/$defs/EffectEvent"
        - "$ref": "#/$defs/MovementEvent"
        - "$ref": "#/$defs/OtherEvent"
        description: Event-specific data
      comment:
        type: string
        description: Optional comment about the event
    required:
    - type
    - data
    additionalProperties: false

  ActionEvent:
    type: object
    title: Action
    description: An action taken by a participant
    properties:
      type:
        "$ref": "#/$defs/ActionType"
      description:
        type: string
        description: Optional description of the action
    required:
    - type
    additionalProperties: false
  
  AttackAction:
    type: object
    title: Attack Action
    description: A melee or ranged attack
    properties:
      type:
        const: attack
      targetId:
        "$ref": "#/$defs/ParticipantRef"
        description: ID of target participant (must match a participant id in Encounter.participants)
      hit: { "$ref": "#/$defs/Success", description: Whether the attack hit }
      damage: {type: integer, minimum: 0, description: Damage dealt (optional)}
      damageType: { "$ref": "#/$defs/DamageType" }
    required:
    - type
    - targetId
    - hit
    additionalProperties: false

  CastSpellAction:
    type: object
    title: Cast Spell Action
    description: Casting a spell
    properties:
      type: { const: cast_spell }
      spellName: { type: string, description: Name of the spell }
      target: { type: string, description: Target designation (participant id, 'area', 'self', etc.) }
      targetIds:
        type: array
        description: List of target participant IDs (must match participant ids in Encounter.participants
          if present)
        items:
          "$ref": "#/$defs/ParticipantRef"
      hit: { "$ref": "#/$defs/Success", description: Whether the spell hit/affected targets (optional) }
      damage: { type: integer, minimum: 0, description: Damage dealt (optional) }
      damageType: { "$ref": "#/$defs/DamageType", description: Type of damage (optional) }
    required:
    - type
    - spellName
    additionalProperties: false

  InteractAction:
    type: object
    title: Interact Action
    description: Interacting with an object or creature
    properties:
      type: { const: interact }
      target:
        type: string
        description: Target (participant id or designation)
      description:
        type: string
        description: Description of the interaction
    required:
    - type
    additionalProperties: false
  
  DashAction:
    type: object
    title: Dash Action
    description: Dashing/moving extra distance
    properties:
      type: { const: dash }
    required:
    - type
    additionalProperties: false
  
  DisengageAction:
    type: object
    title: Disengage Action
    description: Disengaging to avoid opportunity attacks
    properties:
      type: { const: disengage }
    required:
    - type
    additionalProperties: false

  DodgeAction:
    type: object
    title: Dodge Action
    description: Dodging to increase AC
    properties:
      type: { const: dodge }
    required:
    - type
    additionalProperties: false

  HelpAction:
    type: object
    title: Help Action
    description: Helping another participant
    properties:
      type: { const: help }
      targetId:
        "$ref": "#/$defs/ParticipantRef"
        description: ID of the participant being helped (must match a participant id in
          Encounter.participants)
    required:
    - type
    - targetId
    additionalProperties: false

  HideAction:
    type: object
    title: Hide Action
    description: Attempting to hide
    properties:
      type: { const: hide }
    required:
    - type
    additionalProperties: false

  ReadyAction:
    type: object
    title: Ready Action
    description: Readying an action for later in the round
    properties:
      type: { const: ready }
      description:
        type: string
        description: Description of the readied action
    required:
    - type
    additionalProperties: false

  SearchAction:
    type: object
    title: Search Action
    description: Searching for something
    properties:
      type: { const: search }
      description:
        type: string
        description: Description of what is being searched
    required:
    - type
    additionalProperties: false

  UseObjectAction:
    type: object
    title: Use Object Action
    description: Using an object or item
    properties:
      type: { const: use_object }
      description:
        type: string
        description: Description of the object being used
    required:
    - type
    additionalProperties: false

  EffectEvent:
    type: object
    title: Effect
    description: A magical or environmental effect
    properties:
      name:
        type: string
        description: Name of the effect
      description:
        type: string
        description: Description of the effect
      affectedParticipants:
        type: array
        description: IDs of affected participants
        items:
          "$ref": "#/$defs/ParticipantRef"
    required:
    - name
    additionalProperties: false

  MovementEvent:
    type: object
    title: Movement
    description: Movement of a participant
    properties:
      distance:
        type: number
        minimum: 0
        description: Distance moved
      direction:
        type: string
        description: Direction or destination
    additionalProperties: false
  
  OtherEvent:
    type: object
    title: Other Event
    description: Any other event not fitting other categories
    properties:
      description:
        type: string
        description: Description of the event
    additionalProperties: false

properties:
  campaigns:
    "$ref": "#/$defs/Campaigns"
    # type: array
    # description: List of campaigns
    # items:
    #   "$ref": "#/$defs/Campaign"
    # uniqueItems: true
